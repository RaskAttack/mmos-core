<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #2b2b2b; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 20px; }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(16, 20px); 
            grid-template-rows: repeat(16, 20px); 
            gap: 1px; 
            background-color: #444; 
            border: 2px solid #666;
            margin-bottom: 20px;
        }
        .pixel { width: 20px; height: 20px; background-color: transparent; cursor: crosshair; transition: background-color 0.1s; }
        .pixel:hover { border: 1px solid white; box-sizing: border-box; }
        
        button {
            padding: 10px 20px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #cc0000; }
    </style>
</head>
<body>
    <h2>MMOS Cursor Creator</h2>
    <input type="color" id="colorPicker" value="#ff0000" style="margin-bottom: 10px; cursor: pointer;">
    
    <div id="grid"></div>
    
    <button id="saveBtn">Save Cursor (.png)</button>

    <canvas id="hiddenCanvas" width="16" height="16" style="display:none;"></canvas>

    <script src="popup.js"></script>
</body>
</html>
