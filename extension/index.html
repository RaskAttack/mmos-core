<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #2b2b2b; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(16, 20px); 
            grid-template-rows: repeat(16, 20px); 
            gap: 1px; 
            background-color: #444; 
            border: 2px solid #666;
            margin-bottom: 20px;
        }
        .pixel { width: 20px; height: 20px; background-color: transparent; cursor: crosshair; }
        .pixel:hover { border: 1px solid white; }
    </style>
</head>
<body>
    <h2>MMOS Cursor Creator</h2>
    <input type="color" id="colorPicker" value="#ff0000" style="margin-bottom: 10px;">
    
    <div id="grid"></div>
    
    <button onclick="saveCursor()">Save Cursor</button>

    <script>
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        let isDrawing = false;

        // Generate the 16x16 grid
        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            
            // Allow clicking and dragging to draw
            pixel.addEventListener('mousedown', (e) => { isDrawing = true; e.target.style.backgroundColor = colorPicker.value; });
            pixel.addEventListener('mouseover', (e) => { if (isDrawing) e.target.style.backgroundColor = colorPicker.value; });
            pixel.addEventListener('mouseup', () => { isDrawing = false; });
            
            grid.appendChild(pixel);
        }
        document.addEventListener('mouseup', () => { isDrawing = false; });

        function saveCursor() {
            // Later: Code to turn these colors into a .png or JSON array to send to PocketBase!
            alert("Ready to export to Pocketbase!");
        }
    </script>
</body>
</html>
